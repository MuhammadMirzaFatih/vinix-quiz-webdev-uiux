version: '3.8'

services:
  # Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: vinix7_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vinix7_quiz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../database/seeds/01_courses_and_sections.sql:/docker-entrypoint-initdb.d/02_courses.sql
      - ../database/seeds/02_sample_questions.sql:/docker-entrypoint-initdb.d/03_questions.sql
    networks:
      - vinix_net

  # Back-End REST API Service
  backend:
    build:
      context: ../back-end
      dockerfile: ../devops/Dockerfile.backend
    container_name: vinix7_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/vinix7_quiz
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: supersecret_vinix7_jwt_key_2026
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - vinix_net

  # Front-End Web Application
  frontend:
    build:
      context: ../front-end
      dockerfile: ../devops/Dockerfile.frontend
    container_name: vinix7_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - vinix_net

volumes:
  pgdata:

networks:
  vinix_net:
    driver: bridge
